<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" role="img" aria-labelledby="title desc">
  <title id="title">Second Brain fork walkthrough</title>
  <desc id="desc">Public GitHub READMEs load into Oracle 26ai, then hybrid search and wiki, then MCP in Cursor and Claude.</desc>

  <rect width="980" height="260" fill="#0f172a" rx="16"/>

