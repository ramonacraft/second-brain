  <text x="490" y="246" fill="#475569" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle">Content domain: TestMCP -&gt; ForgeQA -&gt; Release Gate -&gt; War Room | public sources only</text>
