  <rect x="500" y="128" width="170" height="44" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="585" y="156" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Compiled wiki</text>

